name: Test rag-pipeline

on:
  push:
    paths:
      - "python/rag-pipeline/**"
      - "python/lib-schemas/**"
  pull_request:
    paths:
      - "python/rag-pipeline/**"
      - "python/lib-schemas/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/rag-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install pre-commit
        run: pip install pre-commit
        working-directory: ${{ github.workspace }}

      - name: Run pre-commit
        run: pre-commit run --files $(git ls-files 'python/rag-pipeline/')
        working-directory: ${{ github.workspace }}

      - name: Run tests
        run: uv run pytest
